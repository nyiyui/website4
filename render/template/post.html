{{define "title"}}{{.Title}} - Ken Shibata{{end}}

{{define "head"}}
{{if .Description}}<meta name="description" content="{{.Description}}">{{end}}
{{if .Authors}}<meta name="authors" content="{{.Authors}}">{{end}}
{{if .Keywords}}<meta name="keywords" content="{{.Keywords}}">{{end}}
<style>
  aside {
    padding-left: 1em;
    margin-left: 0.5em;
    box-shadow: inset 6px 0 5px -5px #137a7f;
    color: #137a7f;
  }
  @media (prefers-color-scheme: dark) {
    aside {
      box-shadow: inset 6px 0 5px -5px #86cecb;
      color: #86cecb;
    }
  }
</style>
{{end}}

{{define "content"}}
<article>
  <h1>{{.Title}}</h1>
  <p>By {{.Authors}}</p>
  {{if not .Date.IsZero}}<p>Published on <time datetime="{{.Date.Format "2006-01-02"}}">{{.Date.Format "2006-Jan-02"}}</time></p>{{end}}
  {{.Content}}
</article>
{{end}}
