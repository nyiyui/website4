<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{block "title" .}}Ken Shibata{{end}}</title>
    {{block "head" .}}{{end}}
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0 0 1em;
      }
      main, footer {
        max-width: 40em;
        margin: 0 auto;
        padding: 0 1em;
      }
      .topbar {
        background-color: #ffa8d4;
        color: #000;
      }
      .topbar-inner {
        max-width: 40em;
        margin: 0 auto;
        padding: 0.5em 1em;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      nav a {
        margin-left: 1em;
      }
      nav a, nav a:visited {
        color: #000;
      }
      :target {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-inner">
        <header role="banner">
          <img src="/favicon.ico" alt="" width="32" height="32" style="vertical-align: middle"> Ken Shibata
        </header>
        <nav role="navigation">
          <a href="/">Home</a>
          <a href="/all-posts.html">Blog</a>
          <a href="https://convind4.kiyuri.ca">Wiki</a>
        </nav>
      </div>
    </div>
    <main role="main">
      {{block "content" .}}{{end}}
    </main>
    <footer role="contentinfo">
      <a href="https://www.julianlbauer.com">←</a>
      Bay Leaf Webring
      <a href="https://dan.onl">→</a>
    </footer>
  </body>
</html>
