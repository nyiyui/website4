<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{block "title" .}}Ken Shibata{{end}}</title>
    {{block "head" .}}{{end}}
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        max-width: 40em;
        margin: 1em auto;
        padding: 0 1em;
      }
      nav {
        font-family: system-ui, sans-serif;
      }
      nav a, nav a:visited {
        text-decoration: none;
        /* I think the links look like links enough (it's called Home and Blog!). */
      }
      :target {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <nav role="navigation">
      <!-- combined banner and navigation but oh well -->
      <img src="/favicon.ico" alt="" width="32" height="32" style="vertical-align: middle"> Ken Shibata
      <a href="/">Home</a>
      <a href="/all-posts.html">Blog</a>
    </nav>
    <main role="main">
      {{block "content" .}}{{end}}
    </main>
    <footer role="contentinfo">
      <a href="https://www.julianlbauer.com">←</a>
      Bay Leaf Webring
      <a href="https://dan.onl">→</a>
    </footer>
  </body>
</html>
