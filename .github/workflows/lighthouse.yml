name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build site
        run: nix build .#site

      - name: Copy build output
        run: cp -rL result www

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Discover URLs
        run: |
          find www -type f -name '*.html' | sed 's#^www##' | sort > urls.txt
          jq -Rn '[inputs]' urls.txt > urls.json
          jq --slurpfile urls urls.json '.ci.collect.url = $urls[0]' lighthouserc.json > lighthouserc.tmp.json
          mv lighthouserc.tmp.json lighthouserc.json
          cat lighthouserc.json

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Build comment body
        run: |
          {
            echo "### Lighthouse CI results"
            echo
            jq -r --slurpfile links .lighthouseci/links.json '
              ($links[0]) as $l |
              "| URL | Performance | Accessibility | Best Practices | SEO | Report |",
              "| --- | --- | --- | --- | --- | --- |",
              (.[] | select(.isRepresentativeRun) |
                "| " + .url
                + " | " + ((.summary.performance * 100) | round | tostring)
                + " | " + ((.summary.accessibility * 100) | round | tostring)
                + " | " + ((.summary["best-practices"] * 100) | round | tostring)
                + " | " + ((.summary.seo * 100) | round | tostring)
                + " | [report](" + ($l[.url] // "") + ") |"
              )
            ' .lighthouseci/manifest.json
          } > comment.md
          cat comment.md

      - name: Post commit comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md
